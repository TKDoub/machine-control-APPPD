# DRAFT — NOT COMMISSIONED. Resolve TBD values in docs/configuration_data.md.
# Every hardware section is commented intentionally. Do not uncomment wholesale.
[printer]
kinematics: corexy

max_velocity: 150
max_accel: 1500

max_z_velocity: 10
max_z_accel: 100


[stepper_x]
step_pin: mcu:PF13
dir_pin: mcu:PF12
enable_pin: !mcu:PF14 # TBD direction inversion

microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40

endstop_pin: ^mcu:PG6 # NC to ground assumption; verify with QUERY_ENDSTOPS
position_endstop: 0
position_min: 0
position_max: 200
homing_speed: 50
#
[tmc2209 stepper_x]
uart_pin: mcu:PC4
run_current: 0.80
interpolate: False
stealthchop_threshold: 0


[stepper_y]
step_pin: mcu:PG0
dir_pin: mcu:PG1 # TBD direction inversion
enable_pin: !mcu:PF15
rotation_distance: 40
full_steps_per_rotation: 400
microsteps: 16
endstop_pin: ^mcu:PG9 # NC to ground assumption
position_endstop: 0
position_min: 0
position_max: 200
homing_speed: 50
#
[tmc2209 stepper_y]
uart_pin: mcu:PD11
run_current: 0.80
interpolate: False
stealthchop_threshold: 0

