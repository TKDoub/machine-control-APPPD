# DRAFT — NOT COMMISSIONED. Uncomment only after board/MCU commissioning.
[fan]
# 3DFAN0 + 3DFAN1: one spliced part-cooling output, controlled by slicer M106/M107.
pin: EBB0:PA0
max_power: 1.0
shutdown_speed: 0
# 
[heater_fan fdm_heatsink]
# # 3DFAN2: on while heater target is nonzero or temperature exceeds cooldown threshold.
pin: EBB0:PA1
heater: extruder
fan_speed: 1.0
heater_temp: 50.0 # Klipper default, provisional cooldown threshold for commissioning
shutdown_speed: 1.0
