# Klipper version's LOAD_CELL_DIAGNOSTIC and LOAD_CELL_CALIBRATE workflow.
# Do not guess calibration, filter settings, thresholds or tool offsets.
# The probe speed above does NOT replace stepper_z homing_speed.
